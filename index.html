<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Praveen Ramesh — Interactive App & Game Developer. Portfolio showcasing apps, games, and systems." />
    <meta name="theme-color" content="#FDF6E3" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico">
    <title>Praveen Ramesh — Portfolio</title>
  </head>
  <body>
    <a class="skip-link" href="#site-root">Skip to content</a>
    <header role="banner" class="site-header">
      <div class="container">
        <div class="site-branding"></div>
        <nav class="header-games" aria-label="Mini-games">
          <button class="game-icon" id="game-pacman" title="Play Pac-Man" aria-label="Play Pac-Man">
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
              <circle cx="12" cy="12" r="10" fill="#FFFF00"/>
              <path d="M12 12 L22 6 L22 18 Z" fill="#0D0D0D"/>
              <circle cx="10" cy="7" r="2" fill="#000"/>
            </svg>
          </button>
          <button class="game-icon" id="game-snake" title="Play Snake" aria-label="Play Snake">
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
              <rect x="2" y="10" width="6" height="6" rx="1" fill="#00FF41"/>
              <rect x="7" y="10" width="5" height="5" fill="#00DD38"/>
              <rect x="11" y="10" width="5" height="5" fill="#00BB30"/>
              <rect x="15" y="10" width="5" height="5" fill="#009928"/>
              <rect x="15" y="14" width="5" height="5" fill="#007720"/>
              <circle cx="4" cy="12" r="1" fill="#000"/>
              <circle cx="6" cy="12" r="1" fill="#000"/>
            </svg>
          </button>
          <button class="game-icon" id="game-space" title="Play Space Shooter" aria-label="Play Space Shooter">
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
              <path d="M12 2 L18 20 L12 16 L6 20 Z" fill="#00C2FF"/>
              <path d="M12 8 L14 18 L12 15 L10 18 Z" fill="#0060AA"/>
              <rect x="10" y="19" width="4" height="3" rx="0.5" fill="#FFD60A"/>
              <circle cx="8" cy="5" r="0.8" fill="#FFF" opacity="0.7"/>
              <circle cx="18" cy="10" r="0.6" fill="#FFF" opacity="0.5"/>
            </svg>
          </button>
        </nav>
      </div>
    </header>

    

    <main id="app" role="main" class="container"></main>

    

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
