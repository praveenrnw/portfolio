<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Praveen Ramesh — Interactive App & Game Developer. Portfolio showcasing apps, games, and systems." />
    <meta name="theme-color" content="#0E0820" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico">
    <title>Praveen Ramesh — Portfolio</title>
  </head>
  <body>
    <a class="skip-link" href="#site-root">Skip to content</a>
    <header role="banner" class="site-header">
      <div class="container">
        <div class="site-branding"></div>
        <nav class="header-games" aria-label="Mini-games">
          <button class="game-icon" id="game-pacman" title="Play Pac-Man" aria-label="Play Pac-Man" data-label="PAC-MAN">
            <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
              <path d="M16 3 A13 13 0 1 1 16 29 A13 13 0 1 1 16 3" fill="#FFD700"/>
              <path d="M16 16 L30 8 L30 24 Z" fill="#1a1a2e"/>
              <circle cx="14" cy="10" r="2.5" fill="#1a1a2e"/>
              <circle cx="6" cy="22" r="1.5" fill="#FFB8AE"/>
              <circle cx="22" cy="3" r="1.5" fill="#FF0000"/>
              <circle cx="26" cy="20" r="1.2" fill="#00FFFF"/>
            </svg>
          </button>
          <button class="game-icon" id="game-snake" title="Play Snake" aria-label="Play Snake" data-label="SNAKE">
            <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
              <rect x="3" y="12" width="7" height="7" rx="2" fill="#00FF41"/>
              <rect x="9" y="12" width="6" height="6" rx="1" fill="#00DD38"/>
              <rect x="14" y="12" width="6" height="6" rx="1" fill="#00BB30"/>
              <rect x="14" y="17" width="6" height="6" rx="1" fill="#009928"/>
              <rect x="19" y="17" width="6" height="6" rx="1" fill="#007720"/>
              <circle cx="5" cy="14" r="1.2" fill="#000"/>
              <circle cx="8" cy="14" r="1.2" fill="#000"/>
              <rect x="1" y="14" width="2" height="1" rx="0.5" fill="#FF0055"/>
              <circle cx="25" cy="8" r="2" fill="#FF0055"/>
              <circle cx="25" cy="8" r="0.8" fill="#FF4488"/>
            </svg>
          </button>
          <button class="game-icon" id="game-space" title="Play Space Shooter" aria-label="Play Space Shooter" data-label="SPACE">
            <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
              <path d="M16 3 L22 22 L16 18 L10 22 Z" fill="#00C2FF" stroke="#005f99" stroke-width="0.5"/>
              <path d="M16 10 L18.5 20 L16 17 L13.5 20 Z" fill="#003d66"/>
              <rect x="14" y="22" width="4" height="4" rx="1" fill="#FFD60A"/>
              <rect x="15" y="25" width="2" height="3" rx="0.5" fill="#FF6B00" opacity="0.8"/>
              <circle cx="7" cy="6" r="1" fill="#FFF" opacity="0.6"/>
              <circle cx="25" cy="10" r="0.7" fill="#FFF" opacity="0.4"/>
              <circle cx="10" cy="26" r="0.5" fill="#FFF" opacity="0.3"/>
              <circle cx="5" cy="16" r="1.5" fill="#FF0055" opacity="0.8"/>
              <circle cx="5" cy="16" r="0.6" fill="#FFF"/>
            </svg>
          </button>
        </nav>
      </div>
    </header>

    

    <main id="app" role="main" class="container"></main>

    

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
